services:
  postgres:
    image: postgres:16
    container_name: scrobbledelia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snoobble_fm
    ports:
      - "5433:5432"
    volumes:
      - snoobble_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: scrobbledelia-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: scrobbledelia-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build: .
    container_name: scrobbledelia-app
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/snoobble_fm
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - redis
      - rabbitmq

volumes:
  snoobble_pgdata: